<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>دفتر حساب — حبوبات و خشکبار باقری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --paper:#FAF7F0;
    --paper-2:#FFFFFF;
    --card:#FFFFFF;
    --ink:#3A322A;
    --ink-soft:#8a7f6d;
    --olive:#6B7B4F;
    --olive-dark:#5c4a30;
    --gold:#B08D3D;
    --gold-soft:#DCC98A;
    --rust:#8B6F47;
    --amber:#B08D3D;
    --red:#9B3B2E;
    --line:#E7DDC7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    font-family:'Vazirmatn',Tahoma,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    font-variant-numeric: tabular-nums;
  }
  header{
    padding:22px 20px 16px;
    text-align:center;
    border-bottom:2px solid var(--gold-soft);
    background:var(--paper-2);
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    font-weight:800;
    color:var(--olive-dark);
    letter-spacing:.3px;
  }
  header p{
    margin:6px 0 0;
    font-size:.85rem;
    color:var(--ink-soft);
  }
  nav{
    display:flex;
    overflow-x:auto;
    gap:0;
    background:var(--card);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:10;
    -webkit-overflow-scrolling:touch;
  }
  nav button{
    flex:1;
    min-width:76px;
    padding:13px 6px;
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:.82rem;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    transition:.15s;
    white-space:nowrap;
  }
  nav button.active{
    color:var(--olive-dark);
    border-bottom-color:var(--gold);
    background:var(--paper);
  }
  main{padding:16px;max-width:720px;margin:0 auto;padding-bottom:80px;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-top:2px solid var(--gold-soft);
    border-radius:10px;
    padding:14px;
    box-shadow:0 1px 3px rgba(90,70,30,.05);
  }
  .card .label{font-size:.75rem;color:var(--ink-soft);margin-bottom:4px;}
  .card .value{font-size:1.2rem;font-weight:700;}
  .card.wide{grid-column:1/-1;}
  .accent-olive{color:var(--olive-dark);}
  .accent-rust{color:var(--rust);}
  .accent-red{color:var(--red);}
  .accent-amber{color:var(--amber);}

  h2.section-title{
    font-size:1.05rem;
    margin:22px 0 10px;
    color:var(--olive-dark);
    display:flex;align-items:center;gap:8px;
  }
  h2.section-title::after{
    content:"";
    flex:1;
    border-bottom:2px dotted var(--line);
    margin-top:4px;
  }
  h3.sub-title{ font-size:.92rem; margin:16px 0 8px; color:var(--olive-dark); }

  .ledger-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:11px 4px;
    border-bottom:1px dotted var(--line);
    cursor:pointer;
  }
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row .name{font-weight:600;white-space:nowrap;}
  .ledger-row .filler{flex:1;border-bottom:1px dotted var(--line);height:0;margin-bottom:4px;}
  .ledger-row .amount{font-weight:700;white-space:nowrap;text-align:left;}
  .ledger-row .sub{font-size:.72rem;color:var(--ink-soft);display:block;font-weight:400;}

  .btn{
    display:inline-block;
    background:var(--gold);
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    font-family:inherit;
    font-weight:600;
    font-size:.85rem;
    cursor:pointer;
  }
  .btn:active{ opacity:.85; }
  .btn.secondary{background:transparent;color:var(--olive-dark);border:1px solid var(--gold);}
  .btn.danger{background:var(--red);}
  .btn.small{padding:6px 10px;font-size:.75rem;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

  .chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{
    padding:6px 12px;border-radius:20px;border:1px solid var(--line);
    background:var(--card);font-size:.78rem;color:var(--ink-soft);cursor:pointer;font-family:inherit;
  }
  .chip.active{background:var(--olive-dark);color:#fff;border-color:var(--olive-dark);}

  .fab{
    position:fixed;
    left:18px;bottom:18px;
    width:52px;height:52px;
    border-radius:50%;
    background:var(--gold);
    color:#fff;
    font-size:1.6rem;
    border:none;
    box-shadow:0 4px 14px rgba(90,70,30,.25);
    cursor:pointer;
    z-index:20;
  }

  .overlay{
    position:fixed;inset:0;
    background:rgba(46,42,34,.45);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:30;
  }
  .sheet{
    background:var(--paper);
    width:100%;max-width:720px;
    max-height:90vh;overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding:20px;
    border-top:3px solid var(--gold);
    -webkit-overflow-scrolling:touch;
  }
  .sheet h3{margin-top:0;color:var(--olive-dark);padding-left:28px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:.78rem;color:var(--ink-soft);margin-bottom:4px;}
  .field input, .field select, .field textarea{
    width:100%;
    padding:10px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:inherit;
    font-size:.9rem;
    background:var(--card);
    color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:56px; }
  .close-x{
    position:absolute;left:16px;top:14px;
    background:none;border:none;font-size:1.3rem;color:var(--ink-soft);cursor:pointer;
    width:32px;height:32px;
  }
  .empty{
    text-align:center;color:var(--ink-soft);padding:30px 10px;font-size:.9rem;
  }
  .badge{
    display:inline-block;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:700;
  }
  .badge.pending{background:#f3e3c2;color:var(--amber);}
  .badge.cleared{background:#dfe7d2;color:var(--olive-dark);}
  .badge.low{background:#f3d3cc;color:var(--red);}
  .item-mini{font-size:.8rem;color:var(--ink-soft);padding:4px 0;border-bottom:1px dotted var(--line);}
  .toast{
    position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
    background:var(--olive-dark);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:.85rem;z-index:50;opacity:0;transition:.3s;pointer-events:none;
    max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1;}
  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  table th{text-align:right;color:var(--ink-soft);font-weight:600;font-size:.73rem;padding:6px 4px;border-bottom:1px solid var(--line);}
  table td{padding:8px 4px;border-bottom:1px dotted var(--line);}
  .confirm-box{ border:1px solid var(--red); background:#fbeeeb; border-radius:10px; padding:12px; font-size:.82rem; margin-bottom:10px; }

  #printArea{display:none;}
  @media print{
    @page{ size:A4; margin:14mm; }
    html, body{background:#fff !important;}
    body *{visibility:hidden;}
    .overlay, .sheet, header, nav, .fab, .toast{display:none !important;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:block;
      position:absolute;top:0;right:0;left:0;
      background:#fff !important;
      color:#111 !important;
      font-family:'Vazirmatn',Tahoma,sans-serif;
      direction:rtl;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    .inv-doc{ padding:6mm; color:#111; }
    .inv-head{
      display:flex; align-items:center; justify-content:space-between;
      border-bottom:2px solid #222; padding-bottom:10px; margin-bottom:14px;
    }
    .inv-logo{
      width:60px; height:60px; border:1px solid #999; border-radius:6px;
      display:flex; align-items:center; justify-content:center;
      font-size:.7rem; color:#888; flex-shrink:0;
    }
    .inv-brand{ text-align:center; flex:1; }
    .inv-brand-name{ font-size:1.3rem; font-weight:800; }
    .inv-doc-title{ font-size:1rem; margin-top:2px; border:1px solid #333; display:inline-block; padding:2px 14px; border-radius:4px; }
    .inv-meta{ text-align:left; font-size:.85rem; flex-shrink:0; min-width:130px; }
    .inv-customer{
      display:flex; flex-wrap:wrap; gap:4px 20px;
      border:1px solid #ccc; border-radius:6px;
      padding:8px 12px; margin-bottom:14px; font-size:.9rem;
    }
    .inv-table{ width:100%; border-collapse:collapse; margin-bottom:14px; }
    .inv-table th, .inv-table td{ border:1px solid #999; padding:7px; font-size:.85rem; text-align:center; }
    .inv-table thead th{ background:#eee !important; -webkit-print-color-adjust:exact; }
    .inv-totals{ width:65%; margin-right:auto; margin-left:0; border-collapse:collapse; margin-bottom:24px; }
    .inv-totals td{ padding:6px 8px; font-size:.9rem; border-bottom:1px solid #ddd; }
    .inv-totals td:first-child{ color:#444; }
    .inv-totals td:last-child{ text-align:left; font-weight:600; }
    .inv-totals .inv-final td{ border-top:2px solid #222; font-size:1.05rem; font-weight:800; padding-top:8px; }
    .inv-signatures{ display:flex; justify-content:space-between; margin-top:50px; font-size:.85rem; }
    .inv-signatures > div{ width:40%; text-align:center; }
    .inv-sig-line{ border-top:1px solid #666; margin-top:36px; }
  }
  /* on-screen preview version of the invoice doc, used for image export */
  .inv-doc.screen-preview{
    background:#fff;color:#111;direction:rtl;
    font-family:'Vazirmatn',Tahoma,sans-serif;
    padding:14px;border-radius:10px;border:1px solid var(--line);
  }
  .inv-doc.screen-preview .inv-head{ display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid #222; padding-bottom:10px; margin-bottom:14px; }
  .inv-doc.screen-preview .inv-logo{ width:50px;height:50px;border:1px solid #999;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#888;flex-shrink:0; }
  .inv-doc.screen-preview .inv-brand{ text-align:center; flex:1; }
  .inv-doc.screen-preview .inv-brand-name{ font-size:1.1rem; font-weight:800; }
  .inv-doc.screen-preview .inv-doc-title{ font-size:.85rem; margin-top:2px; border:1px solid #333; display:inline-block; padding:2px 12px; border-radius:4px; }
  .inv-doc.screen-preview .inv-meta{ text-align:left; font-size:.78rem; flex-shrink:0; }
  .inv-doc.screen-preview .inv-customer{ display:flex; flex-wrap:wrap; gap:3px 16px; border:1px solid #ccc; border-radius:6px; padding:7px 10px; margin-bottom:12px; font-size:.8rem; }
  .inv-doc.screen-preview .inv-table{ width:100%; border-collapse:collapse; margin-bottom:12px; font-size:.78rem; }
  .inv-doc.screen-preview .inv-table th, .inv-doc.screen-preview .inv-table td{ border:1px solid #999; padding:5px; text-align:center; }
  .inv-doc.screen-preview .inv-table thead th{ background:#eee; }
  .inv-doc.screen-preview .inv-totals{ width:75%; margin-right:auto; margin-left:0; border-collapse:collapse; font-size:.8rem; }
  .inv-doc.screen-preview .inv-totals td{ padding:5px 8px; border-bottom:1px solid #ddd; }
  .inv-doc.screen-preview .inv-totals td:last-child{ text-align:left; font-weight:600; }
  .inv-doc.screen-preview .inv-final td{ border-top:2px solid #222; font-weight:800; }
</style>
</head>
<body>

<header>
  <h1>حبوبات و خشکبار باقری</h1>
  <p>دفتر حساب — فروش، مشتریان، انبار، تامین‌کننده‌ها</p>
</header>

<nav id="nav"></nav>
<main id="main"></main>
<button class="fab" id="fab" style="display:none;">+</button>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
/* =======================================================================
   حبوبات و خشکبار باقری — دفتر حساب
   فایل تک‌صفحه‌ای، بدون سرور، بدون نیاز به اینترنت برای کارکرد اصلی.
   (فونت وزیرمتن و کتابخانه‌های اکسل/تصویر فقط برای همان قابلیت‌های
   اختیاری از CDN لود می‌شوند؛ اگر اینترنت نبود، بقیه‌ی برنامه عادی کار می‌کند.)
   ======================================================================= */

const DB_NAME = 'baqeriDB';
const DB_VERSION = 1;
const STORE = 'appdata';
const RECORD_KEY = 'main';
const PRERESTORE_KEY = 'preRestoreSnapshot';

// schema versioning (data shape itself is unchanged/backward-compatible;
// this is just a marker so future migrations can tell old saves apart)
const CURRENT_SCHEMA_VERSION = 2;

// simple rotating auto-backup, stored as extra rows in the same IndexedDB
// object store — no new library, no new database
const AUTO_BACKUP_PREFIX = 'autoBackup_';
const AUTO_BACKUP_LIST_KEY = 'autoBackupList';
const AUTO_BACKUP_MAX = 5;
const AUTO_BACKUP_INTERVAL_MS = 12*60*60*1000; // حداکثر هر ۱۲ ساعت یک نسخه

const ROUTES = ['شرق','مرکز','غرب'];
const REGION_SUGGESTIONS = ['رویان','نوشهر','چالوس','سیسنگان','متل‌قو'];
const CATEGORY_SUGGESTIONS = ['حبوبات','خشکبار','آجیل','برنج','ادویه','سایر'];
const VISIT_RESULTS = ['سفارش گرفته شد','سفارش گرفته نشد','فروشگاه بسته بود','فقط بازدید/سرکشی'];

let data = emptyData();
let activeTab = 'dashboard';
let dbInstance = null;
let custFilter = 'all';
let custSortByDebt = false;

function emptyData(){
  return { products: [], customers: [], invoices: [], payments: [], checks: [], suppliers: [], invoiceSeq: 1000, schemaVersion: CURRENT_SCHEMA_VERSION };
}

// ---------- small utilities ----------
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function faToEnDigits(str){
  if(str===null || str===undefined) return '';
  const map = {'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9',
               '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9',
               '٫':'.','،':''};
  return String(str).replace(/[۰-۹٠-٩٫،]/g, ch=>map[ch]!==undefined?map[ch]:ch);
}
function numVal(el){
  if(!el) return 0;
  return parseFloat(faToEnDigits(el.value))||0;
}
function esc(s){
  return String(s===undefined||s===null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toman(n){ return (Math.round(n||0)).toLocaleString('fa-IR'); }
function balanceStatusWord(balance){
  if(balance>0) return 'بدهکار';
  if(balance<0) return 'بستانکار';
  return 'تسویه شده';
}
function balanceStatusText(balance, amountText){
  return balance===0 ? balanceStatusWord(balance) : (balanceStatusWord(balance)+': '+amountText);
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowHHMM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function faDate(iso){
  if(!iso) return '—';
  try{ return new Date(iso).toLocaleDateString('fa-IR'); }catch(e){ return iso; }
}
function daysAgo(iso){
  if(!iso) return Infinity;
  const d = new Date(iso);
  if(isNaN(d)) return Infinity;
  return Math.floor((Date.now()-d.getTime())/86400000);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2000);
}

// ---------- IndexedDB layer ----------
// Chosen over localStorage because: async (never blocks the UI thread on an
// iPhone), much higher storage quota, and it survives Safari's storage
// eviction rules better for a long-lived, years-of-invoices dataset.
function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE)){
        db.createObjectStore(STORE, {keyPath:'key'});
      }
    };
    req.onsuccess = (e)=> resolve(e.target.result);
    req.onerror = (e)=> reject(e.target.error);
  });
}
async function getDB(){
  if(!dbInstance) dbInstance = await openDB();
  return dbInstance;
}
async function dbGet(key){
  const db = await getDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE,'readonly');
    const req = tx.objectStore(STORE).get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = (e)=>reject(e.target.error);
  });
}
async function dbPut(key, value){
  const db = await getDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put({key, value});
    tx.oncomplete = ()=>resolve();
    tx.onerror = (e)=>reject(e.target.error);
  });
}
async function dbDelete(key){
  const db = await getDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = (e)=>reject(e.target.error);
  });
}

// normalize / migrate any older data shape into the current schema so old
// backups (or the previous version of this app) keep working
function normalizeData(parsed){
  const d = emptyData();
  if(!parsed || typeof parsed !== 'object') return d;
  // نسخه‌ی ورودی را فقط برای لاگ/عیب‌یابی نگه می‌داریم؛ نبودش یعنی بکاپ قدیمی (نسخه ۱)
  const inputSchemaVersion = parsed.schemaVersion || 1;
  d.invoiceSeq = parsed.invoiceSeq || 1000;
  d.products = (parsed.products||[]).map(p=>({
    id: p.id||uid(),
    name: p.name||'',
    category: p.category||'',
    packageWeight: p.packageWeight||0,
    buy: p.buy||0,
    wholesale: (p.wholesale!==undefined? p.wholesale : p.sell) || 0,
    retail: (p.retail!==undefined? p.retail : p.sell) || 0,
    sell: p.sell || p.retail || 0,
    stockQty: p.stockQty!==undefined ? p.stockQty : 0,
    minStock: p.minStock||0,
    priceHistory: p.priceHistory||[],
    stockLog: p.stockLog||[],
  }));
  d.customers = (parsed.customers||[]).map(c=>({
    id: c.id||uid(),
    name: c.name||'',
    ownerName: c.ownerName||'',
    phone: c.phone||'',
    address: c.address||'',
    region: c.region||'',
    route: c.route||'',
    note: c.note||'',
    openingBalance: c.openingBalance||0,
    visits: c.visits||[],
  }));
  d.invoices = (parsed.invoices||[]).map(i=>({
    id:i.id||uid(), number:i.number, customerId:i.customerId, date:i.date,
    items:(i.items||[]).map(it=>({
      productId:it.productId, name:it.name, qty:it.qty, price:it.price,
      buyPrice:it.buyPrice||0, discount:it.discount||0, weight:it.weight||0,
    })),
    total:i.total||0, discount:i.discount||0,
    prevBalance:i.prevBalance, cashPaid:i.cashPaid||0, checkPaid:i.checkPaid||0,
    cardPaid:i.cardPaid||0, transferPaid:i.transferPaid||0,
    newBalance:i.newBalance,
    editHistory:i.editHistory||[],
  }));
  d.payments = (parsed.payments||[]).map(p=>({
    id:p.id||uid(), customerId:p.customerId, date:p.date, amount:p.amount,
    method:p.method||'cash', invoiceId:p.invoiceId, note:p.note||'',
    // برگشت‌های قدیمی این فیلد را ندارند => آرایه خالی => رفتار قبلی (فقط اصلاح حساب) دقیقاً حفظ می‌شود
    returnItems: Array.isArray(p.returnItems) ? p.returnItems.map(ri=>({
      productId: ri.productId, name: ri.name||'', qty: ri.qty||0, price: ri.price||0,
    })) : [],
  }));
  d.checks = (parsed.checks||[]).map(c=>({
    id:c.id||uid(), customerId:c.customerId, amount:c.amount, dueDate:c.dueDate,
    checkNumber:c.checkNumber||'', status:c.status||'pending', invoiceId:c.invoiceId,
  }));
  d.suppliers = (parsed.suppliers||[]).map(s=>({
    id:s.id||uid(), name:s.name||'', phone:s.phone||'',
    openingBalance: s.openingBalance||0,
    purchases:(s.purchases||[]).map(p=>({
      id:p.id||uid(), date:p.date, amount:p.amount, desc:p.desc||'', productId:p.productId||'', qty:p.qty||0,
      returns:(p.returns||[]).map(r=>({id:r.id||uid(), date:r.date||p.date, qty:r.qty||0, amount:r.amount||0})),
    })),
    payments:s.payments||[],
  }));
  // بعد از migration و آماده‌سازی کامل داده، همیشه نسخه‌ی فعلی schema خروجی گرفته می‌شود
  d.schemaVersion = CURRENT_SCHEMA_VERSION;
  if(inputSchemaVersion !== CURRENT_SCHEMA_VERSION){
    console.log('normalizeData: migrated data from schemaVersion', inputSchemaVersion, 'to', CURRENT_SCHEMA_VERSION);
  }
  return d;
}

async function loadData(){
  try{
    const record = await dbGet(RECORD_KEY);
    if(record && record.value){
      data = normalizeData(JSON.parse(record.value));
    } else if(window.storage){
      // fallback: recover from an older window.storage-based save, if this
      // file was ever previously run inside a Claude artifact sandbox
      try{
        const legacy = await window.storage.get('baqeri-erp-data', false);
        if(legacy && legacy.value){
          data = normalizeData(JSON.parse(legacy.value));
          await saveData();
        }
      }catch(e){ /* no legacy data — fine */ }
    }
  }catch(e){
    console.error('loadData failed', e);
    showToast('خطا در بارگذاری اطلاعات');
  }
}

async function saveData(){
  try{
    data.schemaVersion = CURRENT_SCHEMA_VERSION;
    await dbPut(RECORD_KEY, JSON.stringify(data));
  }catch(e){
    console.error('save failed', e);
    showToast('⚠️ ذخیره نشد، دوباره تلاش کن');
    return;
  }
  // fire-and-forget: بکاپ خودکار کاملاً جدا از ذخیره‌ی اصلی اجرا می‌شود؛
  // ذخیره‌ی اصلی چند خط بالاتر با موفقیت کامل شده، پس هر خطایی اینجا فقط لاگ می‌شود
  autoBackupTick().catch(e=>console.error('auto backup failed', e));
}

// ---------- backup / restore ----------
async function downloadFile(filename, blobParts, mime){
  const blob = (blobParts instanceof Blob) ? blobParts : new Blob([blobParts], {type:mime});
  // iOS Safari often just previews a blob link instead of saving it — the
  // share sheet's "Save to Files" is the reliable path on iPhone.
  try{
    if(navigator.canShare){
      const file = new File([blob], filename, {type:mime});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:filename});
        return;
      }
    }
  }catch(e){
    // user cancelled the share sheet, or share isn't available — fall back below
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.target = '_blank';
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function validateBackupShape(parsed){
  if(!parsed || typeof parsed !== 'object') return false;
  const arrays = ['products','customers','invoices','payments','checks','suppliers'];
  return arrays.every(k => parsed[k]===undefined || Array.isArray(parsed[k]));
}

async function importBackupJSON(file){
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!validateBackupShape(parsed)){
      showToast('این فایل، فایل بکاپ معتبری نیست');
      return;
    }
    // safety net: keep a snapshot of what's about to be overwritten
    await dbPut(PRERESTORE_KEY, JSON.stringify(data));
    data = normalizeData(parsed);
    await saveData();
    render();
    showToast('اطلاعات با موفقیت بازیابی شد');
  }catch(e){
    console.error(e);
    showToast('فایل بکاپ معتبر نیست یا خراب است');
  }
}

async function undoLastRestore(){
  try{

    if(!snap || !snap.value){ showToast('نسخه‌ی قبل از بازیابی موجود نیست'); return; }
    data = normalizeData(JSON.parse(snap.value));
    await saveData();

}

// ---------- بکاپ خودکار ساده (fire-and-forget، هیچ‌وقت نباید جلوی ذخیره‌ی اصلی را بگیرد) ----------
async function getAutoBackupList(){
  const rec = await dbGet(AUTO_BACKUP_LIST_KEY);
  return (rec && rec.value) ? JSON.parse(rec.value) : [];
}

async function autoBackupTick(){
  const list = await getAutoBackupList();
  const last = list.length ? list[list.length-1].ts : 0;
  if(Date.now() - last < AUTO_BACKUP_INTERVAL_MS) return; // هنوز زوده، لازم نیست نسخه‌ی جدید بگیریم
  const ts = Date.now();
  const key = AUTO_BACKUP_PREFIX + ts;
  await dbPut(key, JSON.stringify(data));
  list.push({key, ts});
  while(list.length > AUTO_BACKUP_MAX){
    const old = list.shift();
    try{ await dbDelete(old.key); }catch(e){ /* نبود یا حذف نشد، مهم نیست */ }
  }
  await dbPut(AUTO_BACKUP_LIST_KEY, JSON.stringify(list));
}

async function restoreFromAutoBackup(key){
  if(!confirm('مطمئنی؟ اطلاعات فعلی با این نسخه‌ی بکاپ خودکار جایگزین می‌شه.')) return;
  try{
    const snap = await dbGet(key);
    if(!snap || !snap.value){ showToast('این نسخه‌ی بکاپ پیدا نشد'); return; }
    // مثل بازیابی از فایل: قبل از جایگزینی، وضعیت فعلی هم نگه داشته می‌شود
    await dbPut(PRERESTORE_KEY, JSON.stringify(data));
    data = normalizeData(JSON.parse(snap.value));
    await saveData();
    render();
    showToast('از بکاپ خودکار بازیابی شد');
  }catch(e){
    console.error(e);
    showToast('بازیابی از بکاپ خودکار ممکن نشد');
  }
}

// ---------- derived calculations ----------
function customerInvoices(cid){ return data.invoices.filter(i=>i.customerId===cid); }
function customerPayments(cid){ return data.payments.filter(p=>p.customerId===cid); }
function customerChecks(cid){ return data.checks.filter(c=>c.customerId===cid); }

// برای هشدار «برگشت بیشتر از فروش قبلی»: مجموع فروخته‌شده و مجموع قبلاً برگشت‌داده‌شده‌ی
// یک کالای مشخص به یک مشتری مشخص
function productSoldQtyToCustomer(cid, productId){
  return customerInvoices(cid).reduce((s,inv)=>
    s + inv.items.filter(it=>it.productId===productId).reduce((a,it)=>a+(it.qty||0),0), 0);
}
function productReturnedQtyByCustomer(cid, productId){
  return customerPayments(cid).filter(p=>p.method==='return').reduce((s,p)=>
    s + (p.returnItems||[]).filter(ri=>ri.productId===productId).reduce((a,ri)=>a+(ri.qty||0),0), 0);
}
function productReturnAvailableQty(cid, productId){
  return Math.max(0, productSoldQtyToCustomer(cid, productId) - productReturnedQtyByCustomer(cid, productId));
}

function customerTotals(cid){
  const invTotal = customerInvoices(cid).reduce((s,i)=>s+i.total,0);
  const payTotal = customerPayments(cid).reduce((s,p)=>s+p.amount,0);
  const checkTotal = customerChecks(cid).reduce((s,c)=>s+c.amount,0);
  const cashOnlyTotal = customerPayments(cid).filter(p=>['cash','card','transfer'].includes(p.method)).reduce((s,p)=>s+p.amount,0);
  const discountTotal = customerPayments(cid).filter(p=>p.method==='discount').reduce((s,p)=>s+p.amount,0);
  const returnTotal = customerPayments(cid).filter(p=>p.method==='return').reduce((s,p)=>s+p.amount,0);
  const c = data.customers.find(x=>x.id===cid);
  const openingBalance = c ? (c.openingBalance||0) : 0;
  const balance = openingBalance + invTotal - payTotal - checkTotal;
  return { invTotal, payTotal, checkTotal, cashOnlyTotal, discountTotal, returnTotal, openingBalance, balance };
}

function customerProfit(cid){
  return customerInvoices(cid).reduce((s,inv)=>{
    return s + inv.items.reduce((a,it)=>a + (it.price - (it.buyPrice||0)) * it.qty - (it.discount||0), 0);
  },0);
}

function customerStats(cid){
  const invs = customerInvoices(cid);
  const pays = customerPayments(cid);
  const t = customerTotals(cid);
  const sortedInvs = invs.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const lastInvoice = sortedInvs[sortedInvs.length-1];
  const firstInvoice = sortedInvs[0];
  const lastPayment = pays.slice().sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  return {
    count: invs.length,
    avgInvoice: invs.length ? t.invTotal/invs.length : 0,
    firstInvoiceDate: firstInvoice ? firstInvoice.date : null,
    lastInvoiceDate: lastInvoice ? lastInvoice.date : null,
    lastPaymentDate: lastPayment ? lastPayment.date : null,
    profit: customerProfit(cid),
    daysSinceLast: lastInvoice ? daysAgo(lastInvoice.date) : Infinity,
  };
}

function customerStatus(cid){
  const st = customerStats(cid);
  if(st.count===0) return 'new';
  if(st.daysSinceLast > 60) return 'lost';
  if(st.daysSinceLast > 21) return 'inactive';
  return 'active';
}

function supplierTotals(sid){
  const s = data.suppliers.find(x=>x.id===sid);
  if(!s) return {purchaseTotal:0, payTotal:0, returnTotal:0, balance:0};
  const purchaseTotal = (s.purchases||[]).reduce((a,p)=>a+p.amount,0);
  const returnTotal = (s.purchases||[]).reduce((a,p)=>a+(p.returns||[]).reduce((b,r)=>b+(r.amount||0),0),0);
  const payTotal = (s.payments||[]).reduce((a,p)=>a+p.amount,0);
  const openingBalance = s.openingBalance||0;
  return { purchaseTotal, payTotal, returnTotal, openingBalance, balance: openingBalance + purchaseTotal - payTotal - returnTotal };
}

function inventoryValue(){
  return data.products.reduce((s,p)=>s + (p.stockQty||0)*(p.buy||0), 0);
}
function lowStockProducts(){
  return data.products.filter(p => (p.minStock||0) > 0 && (p.stockQty||0) <= p.minStock);
}

function isSameMonth(iso, ref){
  const d = new Date(iso), r = ref;
  return d.getFullYear()===r.getFullYear() && d.getMonth()===r.getMonth();
}
function isSameDay(iso, ref){
  const d = new Date(iso);
  return d.toDateString() === ref.toDateString();
}

function globalTotals(){
  const totalSales = data.invoices.reduce((s,i)=>s+i.total,0);
  const totalProfit = data.invoices.reduce((s,i)=>{
    const itemsProfit = i.items.reduce((a,it)=>a + (it.price - (it.buyPrice||0)) * it.qty - (it.discount||0), 0);
    return s + itemsProfit;
  },0);
  const totalReceived = data.payments.filter(p=>['cash','card','transfer'].includes(p.method)).reduce((s,p)=>s+p.amount,0);
  const outstandingChecks = data.checks.filter(c=>c.status!=='cleared').reduce((s,c)=>s+c.amount,0);
  const customerDebt = data.customers.reduce((s,c)=>{
    const t = customerTotals(c.id);
    return s + Math.max(t.balance,0);
  },0);
  const supplierDebt = data.suppliers.reduce((s,sp)=>s+supplierTotals(sp.id).balance,0);

  const now = new Date();
  const todaySales = data.invoices.filter(i=>isSameDay(i.date, now)).reduce((s,i)=>s+i.total,0);
  const todayCount = data.invoices.filter(i=>isSameDay(i.date, now)).length;
  const monthSales = data.invoices.filter(i=>isSameMonth(i.date, now)).reduce((s,i)=>s+i.total,0);
  const monthCount = data.invoices.filter(i=>isSameMonth(i.date, now)).length;

  return { totalSales, totalProfit, totalReceived, outstandingChecks, customerDebt, supplierDebt,
    todaySales, todayCount, monthSales, monthCount };
}

function checksDueSoon(){
  const now = new Date();
  return data.checks.filter(c=>{
    if(c.status==='cleared') return false;
    const due = new Date(c.dueDate);
    const diffDays = (due - now)/86400000;
    return diffDays <= 3;
  }).sort((a,b)=> new Date(a.dueDate)-new Date(b.dueDate));
}

function topProducts(limit){
  const map = {};
  data.invoices.forEach(inv=>inv.items.forEach(it=>{
    if(!map[it.productId]) map[it.productId] = {name:it.name, qty:0, revenue:0};
    map[it.productId].qty += it.qty;
    map[it.productId].revenue += it.qty*it.price - (it.discount||0);
  }));
  return Object.values(map).sort((a,b)=>b.qty-a.qty).slice(0, limit||5);
}
function topCustomers(limit){
  return data.customers.map(c=>({ c, t: customerTotals(c.id) }))
    .sort((a,b)=>b.t.invTotal-a.t.invTotal)
    .slice(0, limit||5)
    .filter(x=>x.t.invTotal>0);
}
function debtorList(limit){
  return data.customers.map(c=>({ c, t: customerTotals(c.id) }))
    .filter(x=>x.t.balance>0)
    .sort((a,b)=>b.t.balance-a.t.balance)
    .slice(0, limit||10000);
}
function inactiveCustomers(){
  return data.customers.filter(c=>{
    const status = customerStatus(c.id);
    return status==='inactive' || status==='lost';
  }).map(c=>({c, st:customerStats(c.id)})).sort((a,b)=>b.st.daysSinceLast-a.st.daysSinceLast);
}

function renderCustomers(main){
  main.innerHTML = `
    <div class="field"><input id="customer-search" placeholder="جستجوی مشتری، منطقه یا مسیر..."></div>
    <div class="chip-row">
      <button class="chip ${custFilter==='all'?'active':''}" data-f="all">همه</button>
      <button class="chip ${custFilter==='debtor'?'active':''}" data-f="debtor">بدحساب</button>
      <button class="chip ${custFilter==='active'?'active':''}" data-f="active">فعال</button>
      <button class="chip ${custFilter==='inactive'?'active':''}" data-f="inactive">بدون خرید اخیر</button>
      <button class="chip ${custFilter==='lost'?'active':''}" data-f="lost">از دست رفته</button>
    </div>
    <div class="btn-row" style="margin-bottom:10px;margin-top:-4px;">
      <button class="btn small secondary" id="sort-debt">${custSortByDebt?'✓ ':''}مرتب‌سازی بر اساس بدهی</button>
    </div>
    <div id="customer-list"></div>
  `;
  function draw(filterText){
    const q = (filterText||'').trim().toLowerCase();
    let list = data.customers.filter(c=>{
      if(!q) return true;
      return (c.name||'').toLowerCase().includes(q) || (c.region||'').toLowerCase().includes(q) || (c.route||'').toLowerCase().includes(q);
    });
    if(custFilter==='debtor') list = list.filter(c=>customerTotals(c.id).balance>0);
    if(custFilter==='active') list = list.filter(c=>customerStatus(c.id)==='active');
    if(custFilter==='inactive') list = list.filter(c=>customerStatus(c.id)==='inactive');
    if(custFilter==='lost') list = list.filter(c=>customerStatus(c.id)==='lost');
    if(custSortByDebt) list = list.slice().sort((a,b)=>customerTotals(b.id).balance-customerTotals(a.id).balance);

    const wrap = document.getElementById('customer-list');
    if(data.customers.length===0){ wrap.innerHTML = `<div class="empty">هنوز مشتری‌ای ثبت نشده. با دکمه + یکی اضافه کن.</div>`; return; }
    if(list.length===0){ wrap.innerHTML = `<div class="empty">چیزی پیدا نشد</div>`; return; }
    wrap.innerHTML = list.map(c=>{
      const t = customerTotals(c.id);
      const color = t.balance > 0 ? 'var(--rust)' : 'var(--olive-dark)';
      const status = customerStatus(c.id);
      const statusLabel = {new:'جدید', active:'فعال', inactive:'بدون خرید اخیر', lost:'از دست رفته'}[status];
      return `<div class="ledger-row" data-open-customer="${c.id}">
        <span class="name">${esc(c.name)}${c.region?` <span class="sub" style="display:inline;">(${esc(c.region)}${c.route?' — '+esc(c.route):''})</span>`:''}</span>
        <span class="filler"></span>
        <span class="amount" style="color:${color}">
          ${balanceStatusText(t.balance, toman(Math.abs(t.balance))+' ت')}
          <span class="sub">${statusLabel}${t.checkTotal>0?` — چک: ${toman(t.checkTotal)} ت`:''}</span>
        </span>
      </div>`;
    }).join('');
    wrap.querySelectorAll('[data-open-customer]').forEach(row=>{
      row.addEventListener('click', ()=>openCustomerDetail(row.dataset.openCustomer));
    });
  }
  draw('');
  document.getElementById('customer-search').addEventListener('input', e=>draw(e.target.value));
  main.querySelectorAll('.chip').forEach(ch=>{
    ch.addEventListener('click', ()=>{ custFilter = ch.dataset.f; renderCustomers(main); });
  });
  document.getElementById('sort-debt').addEventListener('click', ()=>{
    custSortByDebt = !custSortByDebt; renderCustomers(main);
  });
}

function statementDocHtml(c, forPrint){
  const invs = customerInvoices(c.id).map(i=>({date:i.date, type:'فاکتور #'+(i.number||'—'), amount:i.total, kind:'debit'}));
  const pays = customerPayments(c.id).map(p=>({date:p.date, type:paymentMethodLabel(p.method), amount:p.amount, kind:'credit'}));
  const checks = customerChecks(c.id).map(ch=>({date:ch.dueDate, type:'دریافت چک'+(ch.status==='cleared'?' (وصول شده)':' (در جریان)'), amount:ch.amount, kind:'credit'}));
  const opening = (c.openingBalance||0) !== 0 ? [{date:'0000-01-01', type:'مانده حساب اولیه', amount:Math.abs(c.openingBalance), kind: c.openingBalance>0?'debit':'credit'}] : [];
  const ledger = [...opening, ...invs, ...pays, ...checks].sort((a,b)=>new Date(a.date)-new Date(b.date));

  let running = 0;
  const rowsHtml = ledger.map(l=>{
    running += (l.kind==='debit' ? l.amount : -l.amount);
    return `
      <tr>
        <td>${l.date==='0000-01-01' ? 'ابتدا' : faDate(l.date)}</td>
        <td style="text-align:right;">${esc(l.type)}</td>
        <td>${l.kind==='debit' ? toman(l.amount) : ''}</td>
        <td>${l.kind==='credit' ? toman(l.amount) : ''}</td>
        <td>${toman(running)}</td>
      </tr>
    `;
  }).join('');
  const finalBalance = running;
  return `
    <div class="inv-doc ${forPrint?'':'screen-preview'}">
      <div class="inv-head">
        <div class="inv-logo">لوگو</div>
        <div class="inv-brand">
          <div class="inv-brand-name">حبوبات و خشکبار باقری</div>
          <div class="inv-doc-title">صورتحساب مشتری</div>
        </div>
        <div class="inv-meta"><div>تاریخ صدور: <b>${faDate(todayISO())}</b></div></div>
      </div>
      <div class="inv-customer">
        <div>مشتری: <b>${esc(c.name)}</b></div>
        ${c.phone?`<div>تماس: ${esc(c.phone)}</div>`:''}
        ${c.address?`<div>آدرس: ${esc(c.address)}</div>`:''}
      </div>
      <table class="inv-table">
        <thead><tr><th>تاریخ</th><th>شرح</th><th>بدهکار</th><th>بستانکار</th><th>مانده</th></tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="5" style="text-align:center;">تراکنشی ثبت نشده</td></tr>`}</tbody>
      </table>
      <table class="inv-totals">
        <tr class="inv-final"><td>مانده نهایی (${balanceStatusWord(finalBalance)})</td><td>${toman(Math.abs(finalBalance))} تومان</td></tr>
      </table>
      ${forPrint?`
      <div class="inv-signatures">
        <div>امضای فروشنده<div class="inv-sig-line"></div></div>
        <div>امضای خریدار<div class="inv-sig-line"></div></div>
      </div>`:''}
    </div>
  `;
}

async function exportInvoiceImage(invId){
  const inv = data.invoices.find(x=>x.id===invId);
  if(!inv) return;
  if(typeof html2canvas === 'undefined'){
    showToast('برای خروجی تصویر به اینترنت نیاز است (یک‌بار برای بارگذاری کتابخانه)');
    return;
  }
  const cust = data.customers.find(x=>x.id===inv.customerId);
  const holder = document.createElement('div');
  holder.style.position='fixed'; holder.style.left='-9999px'; holder.style.top='0';
  holder.style.width='420px';
  holder.innerHTML = invoiceDocHtml(inv, cust, false);
  document.body.appendChild(holder);
  try{
    const canvas = await html2canvas(holder, {scale:2, backgroundColor:'#ffffff'});
    canvas.toBlob(async (blob)=>{
      await downloadFile(`فاکتور-${inv.number||''}.png`, blob, 'image/png');
      showToast('تصویر فاکتور آماده شد — می‌تونی از واتساپ بفرستی');
    }, 'image/png');
  }catch(e){
    console.error(e);
    showToast('ساخت تصویر ممکن نشد');
  }finally{
    holder.remove();
  }
}

function closeModal(){

}

function openSheet(html){
  const root = document.getElementById('modalRoot');
  // مطمئن شو هر Modal قبلی کاملاً پاک شده (نه فقط مخفی) قبل از ساختن Modal جدید،
  // و یک reflow اجباری بین پاک‌شدن و رندر جدید انجام بده تا ظاهر (گوشه‌های گرد و غیره) بعد از باز/بسته‌شدن‌های مکرر خراب نشه
  closeModal();
  void root.offsetHeight;
  root.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="sheet" style="position:relative;">
        <button class="close-x" id="closeX">×</button>
        ${html}
      </div>
    </div>`;
  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
  document.getElementById('closeX').addEventListener('click', closeModal);
}

      <div style="flex:1;"><label>قیمت عمده</label><input id="f-wholesale" type="text" inputmode="decimal" value="${p?p.wholesale:''}"></div>
      <div style="flex:1;"><label>قیمت مصرف‌کننده</label><input id="f-retail" type="text" inputmode="decimal" value="${p?p.retail:''}"></div>
    </div>
    ${profitPct!==null?`<div class="empty" style="padding:0 0 8px;text-align:right;font-size:.8rem;">درصد سود تقریبی (نسبت به قیمت مصرف‌کننده): ${profitPct}٪</div>`:''}

    <h2 class="section-title">موجودی انبار</h2>
    <div class="field" style="display:flex;gap:8px;">
      <div style="flex:1;"><label>موجودی فعلی</label><input id="f-stock" type="text" inputmode="decimal" value="${p?p.stockQty||0:0}"></div>
      <div style="flex:1;"><label>حداقل موجودی هشدار</label><input id="f-minstock" type="text" inputmode="decimal" value="${p?p.minStock||0:0}"></div>
    </div>
    ${p?`
    <div class="field" style="display:flex;gap:8px;align-items:end;">
      <div style="flex:1;"><label>تغییر سریع موجودی</label><input id="f-adjust-qty" type="text" inputmode="decimal" placeholder="مثلاً ۱۰"></div>
      <button class="btn small" id="stock-in">+ ورود</button>
      <button class="btn small secondary" id="stock-out">- خروج/اصلاح</button>
    </div>
    `:''}

    <div class="btn-row">
      <button class="btn" id="save-product">ذخیره</button>
      ${p?`<button class="btn danger" id="del-product">حذف</button>`:''}
    </div>
    ${history.length?`
      <h2 class="section-title">تاریخچه قیمت</h2>
      ${history.map(h=>`
        <div class="ledger-row">
          <span class="name">${faDate(h.date)}</span>
          <span class="filler"></span>
          <span class="amount">خرید ${toman(h.buy)} / عمده ${toman(h.wholesale!==undefined?h.wholesale:h.sell)} / مصرف‌کننده ${toman(h.retail!==undefined?h.retail:h.sell)}</span>
        </div>
      `).join('')}
    `:''}
    ${stockLog.length?`
      <h2 class="section-title">تاریخچه موجودی</h2>
      ${stockLog.map(l=>`
        <div class="ledger-row">
          <span class="name">${faDate(l.date)} <span class="sub">${l.note?esc(l.note):''}</span></span>
          <span class="filler"></span>
          <span class="amount" style="color:${l.qty>=0?'var(--olive-dark)':'var(--rust)'}">${l.qty>=0?'+':''}${l.qty}</span>
        </div>
      `).join('')}
    `:''}
  `);

  async function persist(){
    const name = document.getElementById('f-name').value.trim();
    const category = document.getElementById('f-cat').value.trim();
    const packageWeight = numVal(document.getElementById('f-pkgw'));
    const buy = numVal(document.getElementById('f-buy'));
    const wholesale = numVal(document.getElementById('f-wholesale'));
    const retail = numVal(document.getElementById('f-retail'));
    const pdate = document.getElementById('f-pdate').value || todayISO();
    const stockQty = numVal(document.getElementById('f-stock'));
    const minStock = numVal(document.getElementById('f-minstock'));
    if(!name){ showToast('نام جنس رو وارد کن'); return null; }
    if(p){
      p.name=name; p.category=category; p.packageWeight=packageWeight;
      p.buy=buy; p.wholesale=wholesale; p.retail=retail; p.sell=retail;
      p.minStock=minStock;
      p.priceHistory = p.priceHistory||[];
      p.priceHistory.push({date:pdate, buy, wholesale, retail});
      if(stockQty !== p.stockQty){
        p.stockLog = p.stockLog||[];
        p.stockLog.push({id:uid(), date:todayISO(), type:'adjust', qty:stockQty-(p.stockQty||0), note:'ویرایش دستی موجودی'});
        p.stockQty = stockQty;
      }
      await saveData();
      return p;
    } else {
      const np = {id:uid(), name, category, packageWeight, buy, wholesale, retail, sell:retail,
        stockQty, minStock, priceHistory:[{date:pdate, buy, wholesale, retail}], stockLog: stockQty?[{id:uid(),date:todayISO(),type:'in',qty:stockQty,note:'موجودی اولیه'}]:[]};
      data.products.push(np);
      await saveData();
      return np;
    }
  }

  document.getElementById('save-product').addEventListener('click', async ()=>{
    const saved = await persist();
    if(!saved) return;
    closeModal(); render(); showToast('ذخیره شد');
  });
  if(p){
    document.getElementById('del-product').addEventListener('click', async ()=>{
      if(!confirm(`جنس «${p.name}» حذف بشه؟`)) return;
      data.products = data.products.filter(x=>x.id!==p.id);
      await saveData(); closeModal(); render(); showToast('حذف شد');
    });
    document.getElementById('stock-in').addEventListener('click', async ()=>{
      const q = numVal(document.getElementById('f-adjust-qty'));
      if(q<=0){ showToast('مقدار رو وارد کن'); return; }
      p.stockQty = (p.stockQty||0) + q;
      p.stockLog = p.stockLog||[];
      p.stockLog.push({id:uid(), date:todayISO(), type:'in', qty:q, note:'ورود کالا'});
      await saveData(); openAddProduct(p.id); showToast('موجودی اضافه شد');
    });
    document.getElementById('stock-out').addEventListener('click', async ()=>{
      const q = numVal(document.getElementById('f-adjust-qty'));
      if(q<=0){ showToast('مقدار رو وارد کن'); return; }
      if(q > (p.stockQty||0)){
        if(!confirm('موجودی فعلی «'+p.name+'» فقط '+(p.stockQty||0)+' عدد است.\n\nبا این خروج، موجودی منفی می‌شود. مطمئنی می‌خوای ادامه بدی؟')) return;
      }
      p.stockQty = (p.stockQty||0) - q;
      p.stockLog = p.stockLog||[];
      p.stockLog.push({id:uid(), date:todayISO(), type:'out', qty:-q, note:'خروج/اصلاح دستی'});
      await saveData(); openAddProduct(p.id); showToast('موجودی کم شد');
    });
  }
}

  return {cash:'دریافت نقد', card:'دریافت با کارت', transfer:'انتقال بانکی', discount:'تخفیف', return:'برگشت از فروش'}[method] || 'دریافت';
}

function openAddTransaction(cid){
  // وضعیت فرم بین رندرهای مجدد شیت نگه داشته می‌شود (همون الگوی openInvoiceForm)
  let method = 'cash';
  let amountStr = '';
  let dateStr = todayISO();
  let noteStr = '';
  // ردیف‌های کالای برگشتی؛ فقط وقتی نوع تراکنش «برگشت از فروش» است استفاده می‌شود و کاملاً اختیاری است
  let returnRows = [];

  function returnItemsSectionHtml(){
    if(method !== 'return') return '';
    if(data.products.length===0){
      return `<div class="empty" style="padding:8px 0;">جنسی ثبت نشده. اگه این برگشت مربوط به کالای مشخصی نیست، فقط دکمه‌ی «ثبت» رو بزن؛ فقط حساب مشتری اصلاح می‌شه.</div>`;
    }
    return `
      <h2 class="section-title">کالای برگشتی (اختیاری)</h2>
      <div class="empty" style="padding:0 0 8px;text-align:right;">اگه این برگشت واقعاً کالا داره، اینجا اضافه کن تا موجودی انبار هم خودکار زیاد بشه. اگه فقط اصلاح حساب مد نظرته، این بخش رو خالی بذار.</div>
      <div id="return-items-wrap">${returnRows.map((r,idx)=>{
        const available = productReturnAvailableQty(cid, r.productId);
        const over = r.qty > available;
        return `
        <div class="field" style="display:flex;gap:6px;align-items:end;">
          <div style="flex:2;">
            <label>جنس</label>
            <select data-ridx="${idx}" class="ret-product">
              ${data.products.map(p=>`<option value="${p.id}" ${p.id===r.productId?'selected':''}>${esc(p.name)}</option>`).join('')}
            </select>
          </div>
          <div style="flex:1;">
            <label>تعداد</label>
            <input type="text" inputmode="decimal" data-ridx="${idx}" class="ret-qty" value="${r.qty||''}">
          </div>
          <div style="flex:1;">
            <label>قیمت واحد (اختیاری)</label>
            <input type="text" inputmode="decimal" data-ridx="${idx}" class="ret-price" value="${r.price||''}">
          </div>
          <button class="btn small danger" data-ridx="${idx}" id="ret-del-${idx}" style="flex:0;">حذف</button>
        </div>
        <div class="sub" style="margin:-6px 0 10px;${over?'color:var(--rust);':''}">
          قابل برگشت طبق فروش‌های قبلی به این مشتری: ${available} عدد${over?' — ⚠️ تعداد وارد شده بیشتر از این مقدار است':''}
        </div>`;
      }).join('')}</div>
      <button class="btn secondary small" id="add-return-row">+ افزودن کالای برگشتی</button>
    `;
  }

  function renderSheet(){
    openSheet(`
      <h3>ثبت تراکنش جدید</h3>
      <div class="field">
        <label>نوع تراکنش</label>
        <select id="f-method">
          <option value="cash" ${method==='cash'?'selected':''}>دریافت نقدی</option>
          <option value="card" ${method==='card'?'selected':''}>دریافت با کارت</option>
          <option value="transfer" ${method==='transfer'?'selected':''}>انتقال بانکی</option>
          <option value="discount" ${method==='discount'?'selected':''}>تخفیف (کاهش بدهی)</option>
          <option value="return" ${method==='return'?'selected':''}>برگشت از فروش</option>
        </select>
      </div>
      <div class="field"><label>تاریخ</label><input id="f-date" type="date" value="${dateStr}"></div>
      <div class="field"><label>مبلغ (تومان)</label><input id="f-amount" type="text" inputmode="decimal" value="${amountStr}"></div>
      <div class="field"><label>توضیح (اختیاری)</label><input id="f-note" value="${esc(noteStr)}"></div>
      ${returnItemsSectionHtml()}
      <div class="btn-row"><button class="btn" id="save-tx">ثبت</button></div>
    `);

    document.getElementById('f-method').addEventListener('change', e=>{
      method = e.target.value;
      if(method==='return' && data.products.length && returnRows.length===0){
        // یک ردیف خالی برای راحتی، ولی کاملاً اختیاری و قابل حذف
      }
      renderSheet();
    });
    document.getElementById('f-date').addEventListener('input', e=>{ dateStr = e.target.value; });
    document.getElementById('f-amount').addEventListener('input', e=>{ amountStr = e.target.value; });
    document.getElementById('f-note').addEventListener('input', e=>{ noteStr = e.target.value; });

    const addBtn = document.getElementById('add-return-row');
    if(addBtn){
      addBtn.addEventListener('click', ()=>{
        const dp = data.products[0];
        returnRows.push({productId:dp.id, qty:1, price:dp.retail||dp.sell||0});
        renderSheet();
      });
    }
    document.querySelectorAll('.ret-product').forEach(el=>el.addEventListener('change', e=>{
      returnRows[e.target.dataset.ridx].productId = e.target.value;
      renderSheet();
    }));
    document.querySelectorAll('.ret-qty').forEach(el=>el.addEventListener('input', e=>{
      returnRows[e.target.dataset.ridx].qty = parseFloat(faToEnDigits(e.target.value))||0;
    }));
    document.querySelectorAll('.ret-price').forEach(el=>el.addEventListener('input', e=>{
      returnRows[e.target.dataset.ridx].price = parseFloat(faToEnDigits(e.target.value))||0;
    }));
    document.querySelectorAll('[id^="ret-del-"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        returnRows.splice(parseInt(btn.dataset.ridx,10), 1);
        renderSheet();
      });
    });

    document.getElementById('save-tx').addEventListener('click', async ()=>{
      const amount = parseFloat(faToEnDigits(amountStr))||0;
      const date = dateStr || todayISO();
      const note = (noteStr||'').trim();
      if(amount<=0){ showToast('مبلغ رو وارد کن'); return; }

      let returnItems = [];
      if(method==='return'){
        returnItems = returnRows
          .filter(r=>r.productId && r.qty>0)
          .map(r=>{
            const prod = data.products.find(p=>p.id===r.productId);
            return {productId:r.productId, name:prod?prod.name:'', qty:r.qty, price:r.price||0};
          });
        // هماهنگی مبلغ برگشت با «مقدار × قیمت واحد» کالاهای برگشتی (فقط وقتی قیمت واحدی وارد شده باشد)
        const expectedReturnAmount = returnItems.reduce((s,ri)=>s+(ri.qty*(ri.price||0)),0);
        if(expectedReturnAmount>0 && Math.abs(expectedReturnAmount-amount)>1){
          const proceedAmount = confirm('⚠️ مبلغ واردشده با «مقدار × قیمت واحد» کالاهای برگشتی هم‌خوانی ندارد.\n\nمبلغ واردشده: '+toman(amount)+' تومان\nمبلغ منطقی طبق کالاها: '+toman(expectedReturnAmount)+' تومان\n\nمطمئنی می‌خوای همینطور ثبت کنی؟');
          if(!proceedAmount) return;
        }
        // بررسی برگشت بیشتر از فروش قبلی؛ فقط هشدار می‌دهیم، جلوی ثبت را کاملاً نمی‌بندیم
        const overItems = returnItems.filter(ri=>ri.qty > productReturnAvailableQty(cid, ri.productId));
        if(overItems.length){
          const lines = overItems.map(ri=>{
            const available = productReturnAvailableQty(cid, ri.productId);
            return `«${ri.name}»: برگشت ${ri.qty} عدد، ولی طبق فروش‌های قبلی فقط ${available} عدد قابل برگشت است`;
          }).join('\n');
          const proceed = confirm('⚠️ این برگشت از فروش‌های ثبت‌شده‌ی این مشتری بیشتر است:\n\n'+lines+'\n\nمطمئنی می‌خوای همینطور ثبت کنی؟');
          if(!proceed) return;
        }
      }

      const payment = {id:uid(), customerId:cid, date, amount, method, note, returnItems};
      data.payments.push(payment);
      if(method==='return' && returnItems.length){
        applyReturnStockEffects(returnItems, date, payment);
      }
      await saveData(); openCustomerDetail(cid); render(); showToast('ثبت شد');
    });
  }

  renderSheet();
}

    <div class="field"><label>شماره چک (اختیاری)</label><input id="f-num"></div>
    <div class="field"><label>مبلغ (تومان)</label><input id="f-amount" type="text" inputmode="decimal"></div>

function openCustomerDetail(cid){
  const c = data.customers.find(x=>x.id===cid);

  const t = customerTotals(cid);
  const st = customerStats(cid);
  const invs = customerInvoices(cid).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const pays = customerPayments(cid).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const checks = customerChecks(cid).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  const visits = (c.visits||[]).slice().sort((a,b)=> new Date(b.date+'T'+(b.time||'00:00')) - new Date(a.date+'T'+(a.time||'00:00')));

  openSheet(`
    <h3>${esc(c.name)}${c.region?` <span class="sub" style="display:inline;">— ${esc(c.region)}${c.route?' / '+esc(c.route):''}</span>`:''}</h3>
    ${c.ownerName?`<div class="empty" style="padding:0 0 4px;text-align:right;">صاحب فروشگاه: ${esc(c.ownerName)}</div>`:''}
    ${c.phone?`<div class="empty" style="padding:0 0 4px;text-align:right;">تلفن: ${esc(c.phone)}</div>`:''}
    ${c.note?`<div class="empty" style="padding:0 0 8px;text-align:right;">یادداشت: ${esc(c.note)}</div>`:''}
    ${c.openingBalance?`<div class="empty" style="padding:0 0 8px;text-align:right;">مانده حساب اولیه (قبل از این برنامه): ${toman(Math.abs(c.openingBalance))} ت ${c.openingBalance>0?'بدهکار':'طلبکار'}</div>`:''}
    <div class="cards">
      <div class="card"><div class="label">تعداد فاکتور</div><div class="value">${st.count}</div></div>
      <div class="card"><div class="label">میانگین هر فاکتور</div><div class="value">${toman(st.avgInvoice)} ت</div></div>

// ---------- برگشت فروش = ورود کالا به انبار (فقط برای برگشت‌های جدید که کالا مشخص کرده‌اند) ----------
function applyReturnStockEffects(returnItems, date, payment){
  returnItems.forEach(ri=>{
    const prod = data.products.find(p=>p.id===ri.productId);
    if(prod){
      prod.stockQty = (prod.stockQty||0) + (ri.qty||0);
      prod.stockLog = prod.stockLog||[];
      prod.stockLog.push({id:uid(), date, type:'return', qty:ri.qty||0, note:'برگشت از فروش', paymentId:payment.id});
    }
  });
}

// ---------- shared invoice stock/payment effects (used by both create + edit, so the two flows can't drift apart) ----------
function applyInvoiceStockEffects(items, date, inv, isNewInvoice){
  // sale = خروج کالا: deduct stock, log it against this invoice
  items.forEach(it=>{
    const prod = data.products.find(p=>p.id===it.productId);
    if(prod){
      // قیمت فاکتور (چه پیش‌فرض، چه دستیِ توافقی با یک مشتری خاص) فقط متعلق به همین فاکتور است؛
      // قیمت رسمی محصول (retail/sell) دیگر هرگز از روی قیمت فاکتور تغییر نمی‌کند —
      // تغییر قیمت رسمی کالا فقط از فرم «ویرایش کالا» انجام می‌شود.
      prod.stockQty = (prod.stockQty||0) - it.qty;
      prod.stockLog = prod.stockLog||[];
      prod.stockLog.push({id:uid(), date, type:'sale', qty:-it.qty, note:'فروش (فاکتور #'+inv.number+')', invoiceId:inv.id});
    }
  });
}
function revertInvoiceStockEffects(inv){
  // undo exactly what applyInvoiceStockEffects did for this invoice's (old) items
  (inv.items||[]).forEach(it=>{
    const prod = data.products.find(p=>p.id===it.productId);
    if(prod){
      prod.stockQty = (prod.stockQty||0) + it.qty;
      prod.stockLog = (prod.stockLog||[]).filter(l=>{
        if(l.invoiceId) return l.invoiceId !== inv.id;
        // legacy entries (created before invoiceId was tracked) — match by tag+qty instead
        return !(l.type==='sale' && l.qty===-it.qty && l.note && l.note.includes('فاکتور #'+inv.number+')'));
      });
    }
  });
}
function pushInvoicePayments(cid, inv, cashPaid, cardPaid, transferPaid, checkAmount, checkDue, checkMeta){
  if(cashPaid>0) data.payments.push({id:uid(), customerId:cid, date:inv.date, amount:cashPaid, method:'cash', invoiceId:inv.id});
  if(cardPaid>0) data.payments.push({id:uid(), customerId:cid, date:inv.date, amount:cardPaid, method:'card', invoiceId:inv.id});
  if(transferPaid>0) data.payments.push({id:uid(), customerId:cid, date:inv.date, amount:transferPaid, method:'transfer', invoiceId:inv.id});
  if(checkAmount>0) data.checks.push({id:uid(), customerId:cid, amount:checkAmount, dueDate:checkDue||todayISO(), checkNumber:(checkMeta&&checkMeta.checkNumber)||'', status:(checkMeta&&checkMeta.status)||'pending', invoiceId:inv.id});
}
function revertInvoicePayments(inv){
  data.payments = data.payments.filter(p=>p.invoiceId!==inv.id);
  data.checks = data.checks.filter(c=>c.invoiceId!==inv.id);
}
